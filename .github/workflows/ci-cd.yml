name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-three-tier-app:
    runs-on: ubuntu-latest

    env:
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
      MYSQL_USER: ${{ vars.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: docker compose version

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Build Docker Image
        run: docker compose build

      - name: Docker Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Image Tagging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag three-tier-app:latest $DOCKERHUB_USERNAME/three-tier-app:${{ github.run_number }}  
        
      - name: Docker Image Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$DOCKERHUB_USERNAME/three-tier-app:${{ github.run_number }}"

      - name: Start Docker containers
        run: docker compose up -d --no-build

      - name: Test Application Health
        run: |
          echo "Waiting for the application to be healthy..."
          sleep 30
          if curl -f http://localhost:8080/health; then
            echo "Application is healthy."
            exit 0
          else
            echo "Application is not healthy."
            exit 1
          fi

      - name: Debug Application
        if: always()
        run: |
          echo "========== CONTAINER STATUS =========="
          docker compose ps -a

          echo "========== APPLICATION LOGS =========="
          docker compose logs app

          echo "========== MYSQL LOGS =========="
          docker compose logs mysql

          echo "========== PORT CHECK =========="
          curl -v http://localhost:8080/health || true

      - name: List Running Containers
        run: docker ps -a
      
